name: Release

# Se déclenche quand un tag de version (ex: v1.10.0) est poussé sur le repo. Construit
# l'installeur Windows et publie directement une release GitHub - plus besoin de token
# personnel ni de terminal local pour publier une mise à jour.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Build et publication de la release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
